# config/config.yaml
# DETR configuration for turbine_split_all_classes dataset (55 species)



ablations:
  use_adaptive_sampler: true  
  use_inner_siou: false

training:
  num_epochs: 400 #50 for full             
  batch_size: 32 # 4 for defomable  1.66batch/sec for 32 
  num_workers: 34 # 34 on A100 0 for local testing
  learning_rate: 0.00001       #0.00001      
  weight_decay: 0.0001
  # Learning rate scheduler
  scheduler_step_size: 40       # Reduce LR every N epochs 
  scheduler_gamma: 0.1          # LR = LR * gamma
  
  # Early stopping
  patience: 100   # Stop if no improvement for N evaluations
  
  device: "cuda"
  output_model_path: "models/detr_caribou/detr_adaptive.pth"

  # Evaluation
  eval_every_n_epochs: 10      # Evaluate less frequently (dataset is larger)
  save_best_model: true
  

  # Checkpointing
  checkpoint_dir: "checkpoints/detr_caribou/detr_adaptive/"
  save_checkpoint_every: 5

  # Resume from checkpoint
  resume_checkpoint: null # set null if starting fresh

evaluation:
  compute_pr_curve: true
  compute_confusion_matrix: true
  confidence_threshold: 0.1  
  iou_threshold: 0.5
  save_plots: true
  plots_dir: "metrics/detr_caribou/detr_adaptive/"
  show_plots: false


