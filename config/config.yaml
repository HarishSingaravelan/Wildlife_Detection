#----------------Caribou model -----------------------

model:
  num_object_classes: 4
  class_names:
   - "background"                    # index 0
   - "Adult Caribou"                 # index 1
   - "Calf Caribou"                  # index 2
   - "Ghost Caribou"                 # index 3

                    

  architecture: "standard_detr"      # Options: "faster_rcnn" or "standard_detr" or "deformable_detr" or "dfine"
  pretrained_model: "facebook/detr-resnet-50"          # Options:  "resnet50_fpn" or "facebook/detr-resnet-50" or "SenseTime/deformable-detr" or "ustc-community/dfine_x_coco"



